# Render blueprint for the API. Import this from the repo root.
#
# The free plan has an EPHEMERAL filesystem: the SQLite file and every uploaded
# image disappear on restart. Two ways out, both below.
services:
  - type: web
    name: retinax-api
    runtime: node
    rootDir: server
    plan: free           # without this line a blueprint defaults to Starter,
                         # and Render asks for a payment card before it will apply
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      # Pin the runtime. The database driver is node:sqlite, which exists from
      # Node 22.5 — an older default here would fall back to a native addon
      # that has to compile during the build.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false          # https://<project>.pages.dev — exactly, no trailing slash
      - key: AI_URL
        sync: false          # the ngrok URL for the Spark. Safe to set to a dead
                             # value: only new uploads need it, and the seeded
                             # demo cases fall back to committed heatmaps.
      - key: SEED_DEMO
        value: "1"           # re-seed demo cases on every boot
    # ---------------------------------------------------------------------
    # Making the data survive deploys, restarts and spin-downs.
    #
    # A disk requires a PAID instance type — free instances cannot have one.
    # To turn it on: change `plan: free` above to `plan: starter`, then
    # uncomment BOTH blocks below. They go together: the disk gives you a
    # mount, and VAR_DIR is what puts the database and the images inside it.
    #
    # Mounting only server/data would keep every row and lose every
    # photograph, so the worklist would come back full of broken images —
    # which reads as a bug, not as a documented trade-off. paths.js exists to
    # keep the two together under one mount.
    #
    # A disk also ends zero-downtime deploys: Render stops the old instance
    # before starting the new one, so expect a few seconds of 502 on deploy.
    #
    # - key: VAR_DIR
    #   value: /var/data
    #
    # disk:
    #   name: retinax-data
    #   mountPath: /var/data
    #   sizeGB: 1
